<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Spring Security App</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        .navbar {
            background: #222;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .container {
            width: 80%;
            max-width: 900px;
            margin: 50px auto;
        }

        .welcome-card {
            background: white;
            padding: 35px;
            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);

            text-align: center;
        }

        .welcome-card h1 {
            margin-bottom: 15px;
        }

        .welcome-card p {
            color: #666;
            margin-bottom: 25px;
        }

        .status {
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .token-box {
            margin-top: 25px;
            text-align: left;
        }

        .token-box label {
            font-weight: bold;
        }

        .token {
            margin-top: 10px;
            padding: 12px;
            background: #f1f1f1;
            border-radius: 5px;

            word-break: break-all;
            font-size: 12px;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

    <h2>Spring Security App</h2>

    <button class="logout-btn"
            onclick="logout()">
        Logout
    </button>

</div>


<!-- MAIN CONTENT -->

<div class="container">

    <div class="welcome-card">

        <h1>Welcome 🎉</h1>

        <p>
            You have successfully logged in using OAuth2.
        </p>


        <!-- LOGIN STATUS -->

        <div id="status"
             class="status">
        </div>


        <!-- TOKEN -->



    </div>

</div>


<script>

    /*
     * Get token from URL
     *
     * Example:
     *
     * http://localhost:8090/home.html?token=abc123
     */

    const urlParams =
        new URLSearchParams(window.location.search);

    const accessToken =
        urlParams.get("token");


    const statusElement =
        document.getElementById("status");

    const tokenElement =
        document.getElementById("token");


    /*
     * Check whether token exists
     */

    if (accessToken) {

        /*
         * Store JWT in browser
         */

        localStorage.setItem(
            "accessToken",
            accessToken
        );


        statusElement.innerText =
            "OAuth2 Login Successful ✅";

        statusElement.classList.add(
            "success"
        );


        /*
         * Display token
         */

        tokenElement.innerText =
            accessToken;


        /*
         * Remove token from URL
         *
         * This changes:
         *
         * /home.html?token=abc123
         *
         * to:
         *
         * /home.html
         */

        window.history.replaceState(
            {},
            document.title,
            "/home.html"
        );

    } else {

        /*
         * Maybe token already exists
         * in localStorage
         */

        const savedToken =
            localStorage.getItem(
                "accessToken"
            );


        if (savedToken) {

            statusElement.innerText =
                "You are logged in ✅";

            statusElement.classList.add(
                "success"
            );

            tokenElement.innerText =
                savedToken;

        } else {

            statusElement.innerText =
                "No access token found ❌";

            statusElement.classList.add(
                "error"
            );

            tokenElement.innerText =
                "Please login first.";

        }

    }


    /*
     * Logout
     */

    function logout() {

        localStorage.removeItem(
            "accessToken"
        );

        window.location.href =
            "/login";

    }

</script>

</body>
</html>
